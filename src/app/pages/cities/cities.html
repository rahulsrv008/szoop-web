<section class="page">
  <div class="wrap page-intro">
    <p class="eyebrow">Cities</p>
    <h1>Opening across <span>India</span></h1>
    <p class="lead">
      A city on this list is a launch market. Your pin code in the app decides whether an expert can
      reach you today.
    </p>
  </div>
  <div class="wrap city-page-grid">
    @for (city of cities; track city) {
      <article class="city-chip">
        {{ city }}
        <small>House help as neighbourhoods come online</small>
      </article>
    }
  </div>
</section>
