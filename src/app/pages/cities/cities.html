<section class="page">
  <div class="wrap">
    <div class="section-head">
      <p class="kicker">Cities</p>
      <h1>Where Oseedy is opening</h1>
      <p class="lead">
        A city on this list is a launch market. Your pin code in the app decides whether an expert
        can reach you today.
      </p>
    </div>
    <div class="page-grid">
      @for (city of cities; track city) {
        <article class="page-card">
          <h3>{{ city }}</h3>
          <p>House help as neighbourhoods come online.</p>
        </article>
      }
    </div>
  </div>
</section>
