<section class="page">
  <div class="wrap faq-page">
    <div>
      <p class="eyebrow">FAQ</p>
      <h1>Questions about <span>Szoop</span></h1>
      <p class="lead">
        Still stuck? Write to
        <a [href]="'mailto:' + site.supportEmail">{{ site.supportEmail }}</a>.
      </p>
    </div>
    <div class="faq-panel">
      <app-faq-list [items]="faqs" />
    </div>
  </div>
</section>
