<header class="site-header" [class.is-scrolled]="scrolled()">
  <div class="wrap header-inner">
    <a class="wordmark" routerLink="/" aria-label="Szoop home">
      <img src="/images/szoop-logo.png" alt="Szoop — Need it? Szoop it." width="168" height="60" />
    </a>
    <nav class="nav" [class.open]="menuOpen()" aria-label="Primary">
      @for (link of links; track link.label) {
        @if (link.fragment) {
          <a [routerLink]="link.path" [fragment]="link.fragment">{{ link.label }}</a>
        } @else {
          <a [routerLink]="link.path" routerLinkActive="active">{{ link.label }}</a>
        }
      }
    </nav>
    <div class="header-actions">
      <a class="btn btn-primary" routerLink="/book">Book now</a>
      <button
        class="menu-btn"
        type="button"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Open menu"
        (click)="toggleMenu()"
      >
        <span></span>
      </button>
    </div>
  </div>
</header>
